name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Um push novo na mesma branch cancela o build anterior: o feedback que importa
# e o do ultimo commit, e a fila de runners e curta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` cobre o ciclo inteiro: enforcer, compilacao, surefire (ArchUnit),
      # failsafe (Testcontainers) e spotless:check. O Docker ja vem no runner
      # ubuntu-latest, entao o Testcontainers nao precisa de setup extra.
      - name: Build e testes
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Auditar dependencias de producao
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Testes
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  infra:
    name: Stack de producao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_DB: synapse_ci
      POSTGRES_USER: synapse_ci
      POSTGRES_PASSWORD: dummy-postgres-ci
      N8N_DB_NAME: n8n_ci
      N8N_DB_USER: n8n_ci
      N8N_DB_PASSWORD: dummy-n8n-db-ci
      N8N_ENCRYPTION_KEY: dummy-n8n-encryption-key-for-compose-ci
      SYNAPSE_TIMEZONE: America/Sao_Paulo
      RABBITMQ_USER: rabbit_ci
      RABBITMQ_PASSWORD: dummy-rabbit-ci
      MINIO_ROOT_USER: dummy-minio-ci
      MINIO_ROOT_PASSWORD: dummy-minio-password-ci
      SYNAPSE_IMAGE_TAG: abcdef1
      N8N_IMAGE_TAG: 0.0.0-ci
      SYNAPSE_TENANT_CODIGO: ci
      SYNAPSE_TENANT_NOME: CI
      MIDIA_DOMINIO: midia.example.test
      SYNAPSE_DOMINIO: crm.example.test
      AUTOMACAO_DOMINIO: automacao.example.test
      SYNAPSE_JWT_SEGREDO: dummy-jwt-secret-with-at-least-32-characters
      SYNAPSE_TOKEN_INTERNO: dummy-internal-token-ci
      WHATSAPP_NUMERO: "123"
      WHATSAPP_TOKEN: dummy-whatsapp-token-ci
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: dummy-webhook-verify-ci
      WHATSAPP_WEBHOOK_SECRET: dummy-webhook-secret-ci
      AUTOMACAO_TOKEN: dummy-automation-token-ci
      TRAEFIK_ROUTER_PREFIX: ci
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe da stack e do init do Postgres
        run: |
          docker compose -f docker/dokploy-stack.yml config --quiet
          sh -n docker/postgres-init/10-create-n8n-database.sh

      - name: Provar que internal v1 nao tem rota publica
        run: |
          if grep -F 'PathPrefix(`/internal/v1`)' docker/dokploy-stack.yml; then
            echo '/internal/v1 voltou a ser roteavel pelo Traefik' >&2
            exit 1
          fi
          grep -F 'SYNAPSE_API_URL: http://synapse-backend-internal:8080/internal/v1' docker/dokploy-stack.yml

  imagens:
    name: Imagem ${{ matrix.nome }} (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: backend
            dockerfile: backend/Dockerfile
            imagem: ghcr.io/synapse-auto/erp-matriz-synapse-backend
          - nome: frontend
            dockerfile: frontend/Dockerfile
            imagem: ghcr.io/synapse-auto/erp-matriz-synapse-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.imagem }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      - name: Buildar e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
