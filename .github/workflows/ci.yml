name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Um push novo na mesma branch cancela o build anterior: o feedback que importa
# e o do ultimo commit, e a fila de runners e curta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` cobre o ciclo inteiro: enforcer, compilacao, surefire (ArchUnit),
      # failsafe (Testcontainers) e spotless:check. O Docker ja vem no runner
      # ubuntu-latest, entao o Testcontainers nao precisa de setup extra.
      - name: Build e testes
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Testes
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
