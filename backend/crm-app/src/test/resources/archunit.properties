# Na etapa E00 os pacotes domain/application ainda nao tem classes, e uma regra
# ArchUnit sobre conjunto vazio falharia o build por padrao. Escrever as regras
# agora e deixa-las inertes por uma etapa e melhor que adiar: elas passam a valer
# sozinhas quando a primeira classe de dominio entrar, na E01.
archRule.failOnEmptyShould=false
