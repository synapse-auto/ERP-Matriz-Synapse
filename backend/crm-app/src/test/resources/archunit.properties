# A E02 trouxe as primeiras classes de dominio, entao as regras do
# ArquiteturaTest passam a ter o que reprovar. Com a flag em true, uma regra
# que deixe de casar com qualquer classe vira falha de build — o que protege
# contra o caso silencioso de alguem renomear um pacote e a regra parar de
# valer sem ninguem perceber.
archRule.failOnEmptyShould=true
