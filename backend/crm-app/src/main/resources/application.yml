# ---------------------------------------------------------------------------
# Configuracao da instancia.
#
# Nenhum valor de negocio mora aqui como constante: tudo vem de variavel de
# ambiente, com um default de desenvolvimento depois dos dois-pontos. A mesma
# imagem de container roda em qualquer filho — o que muda e o que se injeta.
#
# Segredos NUNCA tem default preenchido. Se a variavel nao vier, o valor fica
# vazio e o adaptador que depende dela falha na etapa em que for construido,
# em vez de rodar silenciosamente com credencial de outro ambiente.
# ---------------------------------------------------------------------------
spring:
  application:
    name: ${SYNAPSE_APP_NAME:synapse-crm}
  # Backplane do WebSocket (E06): pub/sub entre instancias, para o chat se
  # comportar igual com uma instancia ou com dez atras do balanceador.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # Teto largo de proposito: quem aplica o limite fino por tipo de midia (imagem/
  # audio/documento) e o EnviarMidiaUseCase, contra configuracao_automacao. Este
  # teto do Spring so existe para nao rejeitar com um erro generico antes de
  # chegar la — 110 MB cobre com folga o maior teto hoje conhecido (documento, 100 MB).
  servlet:
    multipart:
      max-file-size: ${MIDIA_UPLOAD_TAMANHO_MAXIMO:110MB}
      max-request-size: ${MIDIA_UPLOAD_TAMANHO_MAXIMO:110MB}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # Nao vem do ambiente de proposito. O seed de desenvolvimento mora em
    # classpath:db/seed e so entra nesta lista no perfil "dev" (documento no
    # fim do arquivo). Se a lista viesse de variavel de ambiente, bastaria uma
    # variavel errada para semear um banco de producao.
    #
    # O Flyway migra pelo DataSource @Primary, que e o generalDataSource: o
    # pool do chat e reserva do caminho critico e nao e gasto com migration.
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      # A migration de dados usa o mesmo valor que o normalizador em runtime.
      telefone_ddi_padrao: ${TELEFONE_DDI_PADRAO:55}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ---------------------------------------------------------------------------
# Circuit breaker de toda chamada de saida (CLAUDE.md).
#
# Ao abrir, o adaptador devolve recusa TEMPORARIA: a mensagem fica na outbox e
# sai quando o provedor voltar. O atendente nunca ve excecao — degradacao
# explicita, nao erro de tela.
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      canal-meta-cloud:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${CANAL_CB_JANELA:20}
        minimum-number-of-calls: ${CANAL_CB_MINIMO:10}
        failure-rate-threshold: ${CANAL_CB_LIMIAR:50}
        wait-duration-in-open-state: ${CANAL_CB_ESPERA:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      automacao-webhook:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${AUTOMACAO_WEBHOOK_CB_JANELA:10}
        minimum-number-of-calls: ${AUTOMACAO_WEBHOOK_CB_MINIMO:5}
        failure-rate-threshold: ${AUTOMACAO_WEBHOOK_CB_LIMIAR:50}
        wait-duration-in-open-state: ${AUTOMACAO_WEBHOOK_CB_ESPERA:30s}
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

# ---------------------------------------------------------------------------
# Bloco da instancia — docs/07-base-pai-multitenancy.md, secao 4.
# ---------------------------------------------------------------------------
synapse:
  telefone:
    # Configuracao da instancia: filhos de outro pais trocam somente esta variavel.
    ddi-padrao: ${TELEFONE_DDI_PADRAO:55}

  openapi:
    title: ${SYNAPSE_OPENAPI_TITLE:Synapse CRM API}
    description: ${SYNAPSE_OPENAPI_DESCRIPTION:API REST da Base PAI do Synapse CRM}
    version: ${SYNAPSE_OPENAPI_VERSION:v0.1.0}

  suporte:
    tamanho-pagina: ${SUPORTE_TAMANHO_PAGINA:20}

  leads:
    # Uma linha extra e buscada internamente para calcular `temMais`; nao ha COUNT global
    # aqui — quem precisa do total exato chama /api/v1/leads/filtrar/contagem.
    tamanho-pagina: ${LEADS_TAMANHO_PAGINA:50}

  timeline:
    # Uma linha extra e buscada internamente para calcular `temMais`; nao ha COUNT global.
    tamanho-pagina: ${TIMELINE_TAMANHO_PAGINA:20}

  tenant:
    codigo: ${SYNAPSE_TENANT_CODIGO:estrutural-vidros}
    nome-exibicao: ${SYNAPSE_TENANT_NOME:Estrutural Vidros}
    timezone: ${SYNAPSE_TIMEZONE:America/Sao_Paulo}

  canal:
    whatsapp:
      # A UNICA chave que decide qual adaptador de canal roda. Trocar de provedor
      # para um filho e mudar esta variavel — nao ha `if` em lugar nenhum do codigo.
      provedor: ${WHATSAPP_PROVEDOR:meta-cloud}
      url-base: ${WHATSAPP_URL_BASE:https://graph.facebook.com/v21.0}
      numero-principal: ${WHATSAPP_NUMERO:}
      token: ${WHATSAPP_TOKEN:}
      # Dois segredos distintos por contrato da Meta. O verify token e escolhido
      # pela instancia e valida apenas o GET de cadastro; o App Secret calcula o
      # HMAC de cada POST. Sem default: configuracao ausente falha fechada.
      webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
      webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:}
      # Regra da Meta oficial, nao lei da natureza: fora da janela so passa
      # template. Configuravel porque a Meta ja mudou regra de janela antes.
      janela-texto-livre: ${WHATSAPP_JANELA:24h}
      timeout: ${WHATSAPP_TIMEOUT:10s}

    # Publisher da outbox. O intervalo e o que define a latencia percebida entre
    # o clique do atendente e a mensagem sair.
    outbox:
      intervalo-ms: ${OUTBOX_INTERVALO_MS:1000}
      lote: ${OUTBOX_LOTE:50}
      maximo-de-tentativas: ${OUTBOX_MAX_TENTATIVAS:8}
      backoff-inicial: ${OUTBOX_BACKOFF_INICIAL:5s}
      backoff-maximo: ${OUTBOX_BACKOFF_MAXIMO:30m}
      # Reserva persistida antes da chamada externa. Deve ser maior que o timeout
      # do provedor; se o processo morrer, a linha volta depois deste prazo.
      reserva-expiracao: ${OUTBOX_RESERVA_EXPIRACAO:30s}
      # Chamadas independentes ao provedor nao ocupam a fila inteira por uma linha lenta.
      concorrencia: ${OUTBOX_CONCORRENCIA:4}

    webhook:
      intervalo-ms: ${WEBHOOK_INTERVALO_MS:1000}
      lote: ${WEBHOOK_LOTE:50}
      maximo-de-tentativas: ${WEBHOOK_MAX_TENTATIVAS:5}

  # Bulkhead do WebSocket (E06): executores proprios, nunca o pool HTTP nem o
  # do publisher da outbox. Ver DataSourceConfig para a mesma logica aplicada
  # a conexao de banco em vez de thread.
  tempo-real:
    threads-entrada: ${WS_THREADS_ENTRADA:4}
    threads-saida: ${WS_THREADS_SAIDA:4}
    threads-redis: ${WS_THREADS_REDIS:2}
    fila-maxima: ${WS_FILA_MAXIMA:500}
    # "*" em desenvolvimento; um filho em producao fecha para o(s) dominio(s)
    # do proprio frontend.
    origens-permitidas: ${WS_ORIGENS_PERMITIDAS:*}
    # E07 §0: janela maxima do vazamento se uma revogacao se perder no Redis
    # pub/sub (at-most-once). Decisao de risco explicita — ver TempoRealProperties.
    ttl-assinatura-segundos: ${WS_TTL_ASSINATURA_SEGUNDOS:60}

  automacao:
    url-base: ${AUTOMACAO_URL:}
    token-permanente: ${AUTOMACAO_TOKEN:}
    # Protege a ficha do lead e o contrato com o n8n de respostas sem limite operacional.
    resumo-ia-tamanho-maximo: ${AUTOMACAO_RESUMO_IA_TAMANHO_MAXIMO:8000}
    repasse-webhook:
      url: ${AUTOMACAO_WEBHOOK_EVENTOS_URL:}
      timeout: ${AUTOMACAO_WEBHOOK_TIMEOUT:5s}
      intervalo-ms: ${AUTOMACAO_WEBHOOK_INTERVALO_MS:1000}

  # -------------------------------------------------------------------------
  # Storage de midia do chat (E11b). MinIO em dev, S3-compativel em producao
  # (docs/01, docs/09) — mesmo cliente, so muda endpoint/credenciais.
  #
  # endpoint: o que o BACKEND usa para falar com o storage (hostname interno
  # do Docker em dev). url-publica: o host embutido na URL assinada que sai
  # para o browser — vazio cai para "endpoint" (correto quando os dois
  # coincidem, como em producao atras de um dominio unico).
  # -------------------------------------------------------------------------
  midia:
    endpoint: ${MIDIA_S3_ENDPOINT:http://localhost:9000}
    url-publica: ${MIDIA_S3_URL_PUBLICA:}
    bucket: ${MIDIA_S3_BUCKET:synapse-crm-midia}
    # Credencial de acesso ao bucket, nao segredo de assinatura (categoria de
    # POSTGRES_PASSWORD, nao de JWT_SEGREDO): default so de desenvolvimento,
    # casa com MINIO_ROOT_USER/PASSWORD do docker-compose. Producao sobrescreve.
    access-key: ${MIDIA_S3_ACCESS_KEY:minioadmin}
    secret-key: ${MIDIA_S3_SECRET_KEY:minioadmin}
    expiracao-leitura: ${MIDIA_S3_EXPIRACAO_LEITURA:5m}

  alertas:
    webhook-grupo: ${ALERTA_WEBHOOK:}

  # Diagnostico do caminho de mensagens. Limites por ambiente: um filho de
  # maior volume pode ajustar sem recompilar a Base PAI.
  saude:
    critica:
      fila-sem-consumo-maximo: ${SAUDE_FILA_SEM_CONSUMO_MAXIMO:10s}
      outbox-idade-maxima: ${SAUDE_OUTBOX_IDADE_MAXIMA:5m}
      outbox-pendentes-maximo: ${SAUDE_OUTBOX_PENDENTES_MAXIMO:20}
      falhas-consecutivas-para-alertar: ${SAUDE_FALHAS_CONSECUTIVAS_ALERTA:2}
      monitoramento-habilitado: ${SAUDE_MONITORAMENTO_INTERNO_HABILITADO:true}
      intervalo-monitoramento: ${SAUDE_INTERVALO_MONITORAMENTO:30s}

  # Flags de nivel 3 (arquivo da instancia). O mapa e aberto: ligar um modulo
  # para um filho e uma linha aqui. As flags editaveis sem deploy chegam na E08
  # e tem precedencia sobre estas.
  features:
    campanhas: ${FEATURE_CAMPANHAS:true}
    chat-interno: ${FEATURE_CHAT_INTERNO:true}
    fidelizacao: ${FEATURE_FIDELIZACAO:true}

  # -------------------------------------------------------------------------
  # Seguranca.
  #
  # O segredo do JWT NAO tem default. Sem SYNAPSE_JWT_SEGREDO a aplicacao nao
  # sobe — de proposito. Um default de desenvolvimento aqui e um cadeado que vem
  # com a chave: se escapar para producao, qualquer um assina um token de
  # administrador. Gere com: openssl rand -base64 48
  # -------------------------------------------------------------------------
  seguranca:
    jwt-segredo: ${SYNAPSE_JWT_SEGREDO}
    # Curto: um token vazado tem pouca janela de uso.
    validade-access-token: ${SYNAPSE_ACCESS_TOKEN_VALIDADE:15m}
    # Longo, mas revogavel e rotativo a cada uso (ver RenovarSessaoUseCase).
    validade-refresh-token: ${SYNAPSE_REFRESH_TOKEN_VALIDADE:7d}
    # E07 §1: segredo de X-Synapse-Token, o contrato que a Automacao de todo
    # filho consome. Sem default, mesma razao do webhook-secret: esquecer a
    # variavel deixa /internal/v1 inutil, nunca aberta.
    token-interno: ${SYNAPSE_TOKEN_INTERNO:}
    # E10: origem do frontend, para o CORS liberar chamadas diretas do browser
    # (porta diferente da API em dev). Nao e segredo — default de dev aqui e
    # so conveniencia, nao risco.
    frontend-origem: ${SYNAPSE_FRONTEND_ORIGEM:http://localhost:3000}
    # E29: politica de senha configuravel, sem numero fixo no codigo. Default
    # so de conveniencia — nao e segredo, entao nao precisa de ${VAR:?obrigatoria}.
    politica-senha:
      tamanho-minimo: ${SYNAPSE_SENHA_TAMANHO_MINIMO:8}

  # -------------------------------------------------------------------------
  # Particoes mensais de `mensagem`.
  #
  # Um INSERT numa faixa sem particao falha, e falhar ali significa derrubar o
  # envio de mensagens. Por isso a janela e criada com meses de antecedencia e
  # conferida na inicializacao: falhar no start e muito melhor do que falhar
  # no primeiro envio das 9h.
  # -------------------------------------------------------------------------
  atendimento:
    historico:
      tamanho-pagina: ${HISTORICO_MENSAGENS_TAMANHO_PAGINA:50}
    particao:
      meses-a-frente: ${MENSAGEM_PARTICAO_MESES_A_FRENTE:3}
      # Quantos meses alem do corrente precisam existir para o boot passar.
      meses-minimos: ${MENSAGEM_PARTICAO_MESES_MINIMOS:1}
      verificar-na-inicializacao: ${MENSAGEM_PARTICAO_VERIFICAR_BOOT:true}
      # Dia 1 de cada mes, 03:00 — fora do horario protegido (08:00-18:30).
      cron: ${MENSAGEM_PARTICAO_CRON:0 0 3 1 * *}
      # Diario as 07:15, pouco antes do horario protegido: se a rede de
      # seguranca (particao DEFAULT) pegou alguma linha, alguem descobre antes
      # de o expediente comecar, nao depois.
      cron-alerta-default: ${MENSAGEM_PARTICAO_CRON_ALERTA:0 15 7 * * *}

  # -------------------------------------------------------------------------
  # Bulkhead: dois pools sobre o MESMO banco. O pool do chat existe para que um
  # relatorio pesado nunca consiga segurar as conexoes do caminho de mensagens.
  # O timeout do chat e curto de proposito: falhar rapido e melhor que enfileirar
  # o atendente. Ver DataSourceConfig.
  # -------------------------------------------------------------------------
  datasource:
    general:
      url: ${SYNAPSE_DB_URL:jdbc:postgresql://localhost:5432/synapse_crm}
      username: ${SYNAPSE_DB_USER:synapse}
      password: ${SYNAPSE_DB_PASSWORD:synapse}
      hikari:
        pool-name: synapse-geral
        maximum-pool-size: ${SYNAPSE_DB_POOL_GERAL_MAX:12}
        minimum-idle: ${SYNAPSE_DB_POOL_GERAL_MIN:2}
        connection-timeout: ${SYNAPSE_DB_POOL_GERAL_TIMEOUT_MS:30000}
    chat:
      url: ${SYNAPSE_DB_URL:jdbc:postgresql://localhost:5432/synapse_crm}
      username: ${SYNAPSE_DB_USER:synapse}
      password: ${SYNAPSE_DB_PASSWORD:synapse}
      hikari:
        pool-name: synapse-chat
        maximum-pool-size: ${SYNAPSE_DB_POOL_CHAT_MAX:8}
        minimum-idle: ${SYNAPSE_DB_POOL_CHAT_MIN:4}
        connection-timeout: ${SYNAPSE_DB_POOL_CHAT_TIMEOUT_MS:3000}

# ---------------------------------------------------------------------------
# Health checks.
#
# O endpoint raiz do Actuator fica em /internal-health para nao capturar o
# namespace /health/** inteiro. ProbesController preserva os caminhos publicos
# /health/liveness e /health/readiness; /health/critical pertence ao controller
# operacional.
#
# liveness NAO inclui o banco: liveness responde "o processo esta vivo". Incluir
# o banco faria uma oscilacao do Postgres reiniciar o container, que e
# exatamente o oposto do que a regra de estabilidade pede. Quem olha o banco e
# readiness, que so tira a instancia do balanceador.
#
# /health/critical e observado externamente; nunca participa do liveness.
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: internal-health
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false

---
# ===========================================================================
# Perfil dev — a UNICA forma de o seed entrar no jogo.
#
# O seed acrescenta a pasta classpath:db/seed as locations do Flyway. Sem
# `--spring.profiles.active=dev` (ou SPRING_PROFILES_ACTIVE=dev), o Flyway
# nao enxerga R__seed_dev.sql e nao tem como executa-lo. Um ambiente de
# producao nao roda com este perfil, entao a protecao nao depende de
# ninguem lembrar de nada.
# ===========================================================================
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# Janela do relogio na tela: em desenvolvimento vale mais ver PENDENTE virar
# ENVIADO rapido do que economizar consultas vazias ao banco. Em producao a
# decisao e com dados reais de carga, nao um numero fixo aqui.
synapse:
  canal:
    outbox:
      intervalo-ms: 200
