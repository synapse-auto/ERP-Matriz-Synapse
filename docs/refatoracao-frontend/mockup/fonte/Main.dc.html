<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Protótipo v2 (clique entre telas)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./assets/353f820191996dc96fc441c7bfb0d360.css">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1F5FD6"/><rect x="38" y="38" width="24" height="24" rx="4" transform="rotate(45 50 50)" fill="#fff"/></svg></template>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E9EBEF;font-family:'Geist',system-ui,sans-serif}
a{color:#1F5FD6}
a:hover{color:#1A50B8}
</style>
</helmet>
<div style="width:1920px;margin:0 auto">
  <sc-if value="{{ isAtendimentos }}" hint-placeholder-val="{{ false }}">
    <dc-import name="AtendimentosV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isAgendaV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="AgendaV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isMensagensRapidasV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="MensagensRapidasV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isTemplatesV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="TemplatesV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isMensagensProgramadasV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="MensagensProgramadasV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isBancoArquivosV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="BancoArquivosV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isTagsV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="TagsV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isLembretesV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="LembretesV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isGestaoV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="GestaoV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isCampanhasV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="CampanhasV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isAutomacaoV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="AutomacaoV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isHorariosV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="HorariosV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isRelatoriosV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="RelatoriosV2" hint-size="1920px,1080px"></dc-import>

  </sc-if>
  <sc-if value="{{ isConfiguracoesV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="ConfiguracoesV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isFeedbacksV2 }}" hint-placeholder-val="{{ false }}">
    <dc-import name="FeedbacksV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
  <sc-if value="{{ isDashboard }}" hint-placeholder-val="{{ true }}">
    <dc-import name="DashboardV2" hint-size="1920px,1080px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { screen: 'DashboardV2' };
  SCREENS = ['AtendimentosV2','DashboardV2','AgendaV2','MensagensRapidasV2','TemplatesV2','MensagensProgramadasV2','BancoArquivosV2','TagsV2','LembretesV2','GestaoV2','CampanhasV2','AutomacaoV2','HorariosV2','RelatoriosV2','AdminV2','ConfiguracoesV2','FeedbacksV2'];
  componentDidMount(){
    const fromHash=()=>{ const h=decodeURIComponent((location.hash||'').slice(1)); if(this.SCREENS.includes(h)) this.setState({screen:h}); };
    fromHash(); this.onHash=fromHash; window.addEventListener('hashchange',fromHash);
    this.onClick=(e)=>{
      const a=e.target.closest && e.target.closest('a[href]'); if(!a) return;
      const m=(a.getAttribute('href')||'').match(/([A-Za-z0-9]+)\.dc\.html/); if(!m) return;
      e.preventDefault(); e.stopPropagation();
      const q=(a.getAttribute('href')||'').split('?')[1];
      try{ if(q) sessionStorage.setItem('ev_nav_query',q); else sessionStorage.removeItem('ev_nav_query'); }catch(err){}
      const name=this.SCREENS.filter(s=>s.toLowerCase()===m[1].toLowerCase())[0];
      if(name && name!==this.state.screen){ this.setState({screen:name}); window.scrollTo(0,0); }
    };
    document.addEventListener('click',this.onClick,true);
  }
  componentWillUnmount(){ window.removeEventListener('hashchange',this.onHash); document.removeEventListener('click',this.onClick,true); }
  renderVals(){ const s=this.state.screen; return { isAtendimentos:s==='AtendimentosV2', isDashboard:s==='DashboardV2', isAgendaV2:s==='AgendaV2', isMensagensRapidasV2:s==='MensagensRapidasV2', isTemplatesV2:s==='TemplatesV2', isMensagensProgramadasV2:s==='MensagensProgramadasV2', isBancoArquivosV2:s==='BancoArquivosV2', isTagsV2:s==='TagsV2', isLembretesV2:s==='LembretesV2', isGestaoV2:s==='GestaoV2', isCampanhasV2:s==='CampanhasV2', isAutomacaoV2:s==='AutomacaoV2', isHorariosV2:s==='HorariosV2', isRelatoriosV2:s==='RelatoriosV2', isAdminV2:s==='AdminV2', isConfiguracoesV2:s==='ConfiguracoesV2', isFeedbacksV2:s==='FeedbacksV2' }; }
}
</script>
</body>
</html>
